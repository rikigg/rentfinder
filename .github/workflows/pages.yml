name: Deploy Mini App (GitHub Pages)

# This workflow lives in the public frontend-only repo (miniapp published as repo root).

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build for Pages
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: |
          if [ -z "$VITE_API_BASE" ] && [ -f deploy.env ]; then
            # Strip Windows CRLF so `source` works on Linux runners
            sed -i 's/\r$//' deploy.env
            set -a && . ./deploy.env && set +a
          fi
          if [ -z "$VITE_API_BASE" ]; then
            echo "Set secret VITE_API_BASE or commit deploy.env"
            exit 1
          fi
          echo "API base: $VITE_API_BASE"
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
